<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Industry Projects Index</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #64748b;
        --line: #d8e0eb;
        --bg: #eef2f6;
        --panel: #fff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 34px auto 64px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0 0 7px;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      input {
        width: min(360px, 100%);
        height: 42px;
        padding: 0 13px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      .type {
        margin: 16px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      details > summary {
        cursor: pointer;
        list-style: none;
      }

      details > summary::-webkit-details-marker { display: none; }

      .type > summary {
        padding: 18px 20px;
        font-size: 22px;
        font-weight: 800;
        border-bottom: 1px solid transparent;
      }

      .type[open] > summary {
        border-bottom-color: var(--line);
      }

      .facility {
        margin: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfdff;
      }

      .facility > summary {
        padding: 13px 15px;
        font-weight: 780;
      }

      .facility-name {
        color: var(--muted);
        font-weight: 600;
      }

      .company {
        margin: 10px 15px;
        border-top: 1px solid #e5ebf3;
        padding-top: 10px;
      }

      .company > summary {
        font-weight: 740;
      }

      .count {
        color: var(--muted);
        font-size: 13px;
        font-weight: 620;
      }

      ul {
        margin: 8px 0 16px 20px;
        padding: 0;
      }

      li {
        margin: 5px 0;
        color: #334155;
        line-height: 1.35;
      }

      .hidden { display: none; }

      @media (max-width: 760px) {
        header { display: grid; }
        main { width: min(100% - 24px, 1180px); margin-top: 20px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Industry Projects Index</h1>
          <p class="subtitle">Grouped by facility type, specific facility, then company. Source: FY2025 DOE-SC user statistics workbook industry rows.</p>
        </div>
        <input id="search" type="search" placeholder="Search company, facility, or project" />
      </header>
      <section id="index"></section>
    </main>
    <script src="assets/project-index-data.js"></script>
    <script>
      const container = document.querySelector("#index");
      const search = document.querySelector("#search");

      function plural(count, word) {
        return `${count} ${word}${count === 1 ? "" : "s"}`;
      }

      function render(data) {
        container.innerHTML = data.map((typeGroup) => `
          <details class="type" open data-search="${escapeHtml(searchText(typeGroup))}">
            <summary>${escapeHtml(typeGroup.type)}</summary>
            ${typeGroup.facilities.map((facility) => `
              <details class="facility" open data-search="${escapeHtml(searchText(facility))}">
                <summary>${escapeHtml(facility.acronym)} <span class="facility-name">${escapeHtml(facility.name)}</span> <span class="count">${plural(facility.companies.length, "company")}</span></summary>
                ${facility.companies.map((company) => `
                  <details class="company" data-search="${escapeHtml(searchText(company))}">
                    <summary>${escapeHtml(company.name)} <span class="count">${plural(company.project_count, "project")}; ${company.row_count} row${company.row_count === 1 ? "" : "s"}</span></summary>
                    <ul>
                      ${company.projects.map((project) => `<li>${escapeHtml(project.title)} <span class="count">${project.rows > 1 ? `${project.rows} rows` : ""}</span></li>`).join("")}
                    </ul>
                  </details>
                `).join("")}
              </details>
            `).join("")}
          </details>
        `).join("");
      }

      function searchText(value) {
        if (Array.isArray(value)) return value.map(searchText).join(" ");
        if (value && typeof value === "object") return Object.values(value).map(searchText).join(" ");
        return String(value ?? "").toLowerCase();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function applySearch() {
        const term = search.value.trim().toLowerCase();
        document.querySelectorAll("[data-search]").forEach((node) => {
          node.classList.toggle("hidden", term && !node.dataset.search.includes(term));
        });
      }

      render(window.INDUSTRY_PROJECT_INDEX);
      search.addEventListener("input", applySearch);
    </script>
  </body>
</html>
